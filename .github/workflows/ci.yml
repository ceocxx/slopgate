name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: node --test

      - name: Slopgate self-scan (dogfood its own gate)
        run: node bin/slopgate.mjs scan .
